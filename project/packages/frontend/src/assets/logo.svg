<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d563"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c22"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Chess board 4x2 top half -->
  <rect x="8"  y="8"  width="19" height="19" rx="3" fill="url(#gold)" opacity="0.95"/>
  <rect x="27" y="8"  width="19" height="19" rx="3" fill="url(#gold)" opacity="0.18"/>
  <rect x="46" y="8"  width="19" height="19" rx="3" fill="url(#gold)" opacity="0.95"/>
  <rect x="65" y="8"  width="19" height="19" rx="3" fill="url(#gold)" opacity="0.18"/>
  <rect x="8"  y="27" width="19" height="19" rx="3" fill="url(#gold)" opacity="0.18"/>
  <rect x="27" y="27" width="19" height="19" rx="3" fill="url(#gold)" opacity="0.95"/>
  <rect x="46" y="27" width="19" height="19" rx="3" fill="url(#gold)" opacity="0.18"/>
  <rect x="65" y="27" width="19" height="19" rx="3" fill="url(#gold)" opacity="0.95"/>
  <!-- BG text -->
  <text x="50" y="85" font-size="26" font-weight="900" fill="url(#gold)" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" letter-spacing="3">BG</text>
  <!-- bottom accent line -->
  <rect x="18" y="91" width="64" height="3" rx="1.5" fill="url(#gold)" opacity="0.4"/>
</svg>
