<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoardGames Arena</title>
    <meta name="description" content="Играйте в шахматы, шашки, дурак, Alias и Мафию онлайн с друзьями в реальном времени." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0b0c" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BoardGames Arena" />
    <meta property="og:description" content="Играйте в шахматы, шашки, дурак, Alias и Мафию онлайн с друзьями в реальном времени." />
    <meta property="og:image" content="/logo-192.svg" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BoardGames Arena" />
    <meta name="twitter:description" content="Играйте в шахматы, шашки, дурак, Alias и Мафию онлайн с друзьями в реальном времени." />
    <meta name="twitter:image" content="/logo-192.svg" />
  </head>
  <body>
    <div id="root"></div>
    <div id="crash-fallback" style="display:none;padding:40px;font-family:sans-serif;text-align:center">
      <h2>Произошла ошибка загрузки</h2>
      <p>Попробуйте отключить расширения браузера (AdBlock, VPN) или откройте сайт в режиме инкогнито.</p>
      <button onclick="window.location.reload()" style="margin-top:16px;padding:8px 24px;cursor:pointer;font-size:16px">
        Обновить страницу
      </button>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('call stack')) {
          document.getElementById('root').style.display = 'none';
          document.getElementById('crash-fallback').style.display = 'block';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
