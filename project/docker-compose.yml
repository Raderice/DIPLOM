name: board-games-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boardgames}
      POSTGRES_USER: ${POSTGRES_USER:-boardgames}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardgames}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boardgames} -d ${POSTGRES_DB:-boardgames}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-boardgames}:${POSTGRES_PASSWORD:-boardgames}@postgres:5432/${POSTGRES_DB:-boardgames}?schema=public}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://boardgamesarena.ru,https://boardgamesarena.ru,http://91.107.122.49,http://localhost,http://127.0.0.1}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
    command: >-
      sh -c '
      if [ "${DATABASE_PROVIDER:-postgresql}" = "sqlite" ]; then
        npx prisma generate --schema packages/backend/prisma/schema.sqlite.prisma &&
        npx prisma db push --schema packages/backend/prisma/schema.sqlite.prisma;
      else
        npx prisma generate --schema packages/backend/prisma/schema.prisma &&
        npx prisma db push --schema packages/backend/prisma/schema.prisma;
      fi &&
      node packages/backend/dist/index.js'
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    volumes:
      - ./uploads:/repo/uploads
    networks:
      - app_net

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    expose:
      - "4173"
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/repo/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    expose:
      - "6379"
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
