version: "3.9"

name: board-games-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boardgames}
      POSTGRES_USER: ${POSTGRES_USER:-boardgames}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boardgames}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boardgames} -d ${POSTGRES_DB:-boardgames}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-boardgames}:${POSTGRES_PASSWORD:-boardgames}@postgres:5432/${POSTGRES_DB:-boardgames}?schema=public
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - app_net

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-http://localhost}
    depends_on:
      - backend
    expose:
      - "4173"
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    expose:
      - "6379"
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
